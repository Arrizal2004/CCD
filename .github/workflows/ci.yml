name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ccd
          POSTGRES_PASSWORD: ccd123
          POSTGRES_DB: ccddb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://ccd:ccd123@localhost:5432/ccddb_test
          REDIS_URL: redis://localhost:6379
          # Test-only values — never the real production secrets.
          JWT_SECRET: ci-test-secret-not-for-production
          GUAC_ADMIN_PASS: ci-test-only
          ALLOWED_ORIGINS: http://localhost
        run: |
          pytest -q \
            --deselect tests/test_health.py::test_healthz_returns_200 \
            --deselect tests/test_health.py::test_healthz_status_ok
          # Those two deselected tests assert /healthz is fully "ok", which needs a real
          # Proxmox + Guacamole reachable — not available in this CI runner. Every other
          # test (including the rest of test_health.py) still runs normally.

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
