map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security header baseline — berlaku untuk semua response server ini (termasuk proxy ke
    # backend/Guacamole). CSP sengaja TIDAK ditaruh di sini (lihat location / di bawah) karena
    # Guacamole punya kebutuhan script/style sendiri yang tidak mau kami tebak/batasi dari sini.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # Browser cuma menghormati HSTS kalau responsenya diterima lewat HTTPS (mis. via Tailscale
    # Funnel) — aman dikirim juga di response HTTP biasa (akses LAN langsung), browser mengabaikannya.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # IP asli pengunjung kalau dashboard di belakang proxy Cloudflare. Header CF-Connecting-IP hanya
    # dipercaya dari alamat Cloudflare, jadi tidak bisa dipalsukan, dan akses langsung tanpa
    # Cloudflare tidak terpengaruh. $remote_addr (diteruskan sebagai X-Real-IP) lalu berisi IP asli.
    # Daftar alamat dari https://www.cloudflare.com/ips/ (Oktober 2026); perbarui kalau berubah.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Proxy health endpoints ke backend
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy agent installer files ke backend
    location /agent/ {
        proxy_pass http://backend:8000/agent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy WebSocket metrics live (/ws/)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Endpoint internal untuk bastion SSH (dipanggil lewat jaringan Docker), tidak dibuka ke luar.
    location = /api/v1/ssh-keys/authorized {
        return 404;
    }
    location = /api/v1/ssh-keys/events {
        return 404;
    }
    location = /api/v1/ssh-keys/kill-wait {
        return 404;
    }
    location = /api/v1/ssh-keys/killed {
        return 404;
    }

    # Proxy API ke backend (termasuk WebSocket di /api/.../ws)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Proxy Guacamole web app + WebSocket tunnel-nya
    location /guacamole/ {
        proxy_pass http://guacamole:8080/guacamole/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Hanya IP yang ditentukan nginx, bukan X-Forwarded-For kiriman klien yang bisa dipalsukan.
        # Guacamole membacanya lewat RemoteIpValve (REMOTE_IP_VALVE_ENABLED di docker-compose.yml).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Open Web — proxy ke IP privat supaya bisa di-iframe tanpa terblokir Local Network Access.
    # Tiap request divalidasi backend (tiket bertanda tangan, terikat ke IP tujuan, 1 jam).
    # Regex host hanya menerima rentang privat (10/8, 172.16/12, 192.168/16, 100.64/10); backend
    # memeriksa ulang dan membatasi student ke IP VM miliknya.
    location = /_openweb_auth {
        internal;
        proxy_pass http://backend:8000/api/v1/openweb/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location ~ "^/openweb/(?<ow_ticket>[A-Za-z0-9_-]+)/(?<ow_host>(?:10\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])|192\.168|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7]))\.\d{1,3}\.\d{1,3})(?<ow_port>:\d{1,5})?(?<ow_rest>/.*)$" {
        auth_request /_openweb_auth;
        proxy_pass http://$ow_host$ow_port$ow_rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $ow_host$ow_port;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_redirect ~^https?://[^/]+/(.*)$ /openweb/$ow_ticket/$ow_host$ow_port/$1;
        proxy_redirect ~^/(.*)$ /openweb/$ow_ticket/$ow_host$ow_port/$1;
        proxy_cookie_path / /openweb/$ow_ticket/$ow_host$ow_port/;
        # Konten target tidak tepercaya dan same-origin dengan dashboard → paksa origin opak
        # (sandbox tanpa allow-same-origin) agar skripnya tidak bisa membaca token di localStorage.
        add_header Content-Security-Policy "sandbox allow-scripts allow-forms allow-popups allow-downloads" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # SPA fallback — satu-satunya HTML yang benar-benar dirender sebagai top-level document oleh
    # browser (Guacamole/API di atas cuma proxy), jadi CSP ketat khusus ditaruh di sini. `location`
    # yang punya add_header sendiri TIDAK mewarisi add_header dari server{} (perilaku nginx) —
    # makanya header umum di atas diulang di sini juga.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'self' http: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}